; ESP-32 Dev Board 30 PIN (ESP-WROOM-32, 4 MB flash, CH340 USB, no PSRAM)
; https://www.robotics.org.za/ESP32-DEV
; Upload works over the USB-C port. If it fails to connect, hold the BOOT key
; while the upload starts.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = default, esp32_exception_decoder

board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = default.csv      ; ~1.4 MB "spiffs" partition, used by LittleFS
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0
